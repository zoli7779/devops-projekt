name: DevOps Mini Project CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: |
        pytest

    - name: Build Docker image
      run: |
        docker build -t devops-mini-app:latest .

    - name: Deploy and test container locally
      run: |
        docker run -d -p 5000:5000 --name test-container devops-mini-app:latest
        sleep 3
        curl http://localhost:5000/health
        docker stop test-container
        docker rm test-container
        echo "A deploy es a futtatas sikeresen befejezodott!"